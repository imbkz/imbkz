name: generate animation

on:
  # once a day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # lets you trigger it by hand from the Actions tab
  workflow_dispatch:

  # regenerate whenever you push
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Light mode  -> CAclubindia blue squares (#1F5885 ramp), LAWyersclubindia green snake
      # Dark mode   -> LAWyersclubindia green squares (#28A745 ramp), CAclubindia blue snake
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2328A745&color_dots=%23EBEDF0,%23C3D8E8,%238FB4D1,%234E88B5,%231F5885
            dist/github-contribution-grid-snake-dark.svg?color_snake=%232E7BB8&color_dots=%23161B22,%23133D1F,%231B6B2F,%2328A745,%234FD675

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
